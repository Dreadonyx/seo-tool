[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "seoforge"
version = "0.1.0"
description = "Free, open-source CLI that audits and optimizes websites for SEO, AEO and GEO."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Dreadonyx" }]
keywords = ["seo", "aeo", "geo", "llms.txt", "indexnow", "audit", "crawler"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "selectolax>=1.0",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "playwright>=1.44",
  "yake>=0.4.8",
]

[project.optional-dependencies]
# Local semantic clustering. Large download (PyTorch); TF-IDF clustering is used without it.
ml = ["sentence-transformers>=3.0"]
# Google Search Console API via a service account.
google = ["google-auth>=2.29"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "pre-commit>=3.7",
]

[project.scripts]
seoforge = "seoforge.cli:app"

[project.urls]
Homepage = "https://github.com/Dreadonyx/seoforge"

[tool.hatch.build.targets.wheel]
packages = ["src/seoforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["seoforge"]
mypy_path = "src"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["yake.*", "selectolax.*", "sentence_transformers.*", "google.*", "playwright.*"]
ignore_missing_imports = true
